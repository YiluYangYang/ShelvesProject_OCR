[project]
name = "shelves-ocr"
version = "0.1.0"
description = "Chrome網頁瀏覽 + OCR文字偵測系統 (Mac版)"
requires-python = ">=3.10"

dependencies = [
    "easyocr>=1.7",
    "opencv-python>=4.8",
    "mss>=9.0",
    "pyautogui>=0.9",
    "selenium>=4.18",
    "webdriver-manager>=4.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "requests>=2.31",
    "numpy>=1.24,<2.0",  # torch 2.2.x 與 numpy 2.x 二進位不相容
    "torch<2.3",         # easyocr 依賴；2.3+ 已不提供 macOS Intel (x86_64) wheel
    "torchvision<0.18",  # 與 torch<2.3 配套
    "psutil>=7.2.2",
]

[tool.uv]
package = false   # 純腳本專案，不需要打包成 wheel
